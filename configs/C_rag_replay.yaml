agents:
  critic:
    enabled: false
    model: qwen3:4b
    temperature: 0.2
    think: false
  generator:
    model: qwen3.5:4b
    temperature: 0.2
cv:
  folds: 5
  n_jobs: 1
  repeats: 3
  scoring: f1_macro
data:
  exclude_columns:
  - id
  missing_exclusions: ignore
evidence:
  enabled: true
  max_papers: 5
  mode: llm
  model: qwen3:4b
evidence_composition:
  allow_keyword: false
  enabled: true
  reserve_slots: 1
loop:
  candidates_per_iteration: 3
  max_failures: 3
  max_iterations: 3
  min_delta: 0.002
  patience: 4
  max_batch_rounds: 3
rag:
  enabled: true
  planner_model: qwen3:4b
  timeout_sec: 60
  top_k: 5
  replay_from_run: null
seed: 42
test_size: 0.2
evidence_selection:
  enabled: true
  max_records: 9
  max_per_method: 2
  require_structural: true
  max_candidates_per_kind: 2
